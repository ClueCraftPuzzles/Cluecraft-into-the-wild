<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cluecraft - INTO THE WILD</title><style>
    body{font-family:Arial;background:#fff8e8;color:#17263b;max-width:760px;margin:auto;padding:12px}header{background:#102039;color:white;border:3px solid #d6a43b;border-radius:12px;text-align:center;padding:14px}h1{color:#f0c767;margin:0}.panel{background:white;border:1px solid #ddcea8;border-radius:12px;padding:12px;margin:12px 0}#grid{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:2px}.cell{aspect-ratio:1;min-width:0;padding:0;background:#fffdf8;border:1px solid #e3d7bb;border-radius:3px;font-size:clamp(9px,2.5vw,17px);font-weight:bold}.first{background:#f4d57e}.found{background:#c6e4ce;color:#143b25}.words{display:flex;flex-wrap:wrap;gap:6px;padding:0;list-style:none}.words li{padding:6px;border:1px solid #ddcea8;border-radius:6px;font-size:13px}.done{text-decoration:line-through;background:#c6e4ce}#status{text-align:center;font-weight:bold;padding:8px}footer{text-align:center;font-size:13px}</style></head><body><header><h1>CLUECRAFT STUDIO</h1><p>Think Deeper. Find the Hidden.</p><strong>INTO THE WILD</strong></header><section class="panel"><p>Tap the first letter, then tap the last letter. Words can go forward, backward, up, down, or diagonally in either direction.</p><div id="grid"></div><div id="status">Tap the first letter of a word.</div></section><section class="panel"><b>Find these words</b><ul id="words" class="words"></ul></section><footer>Cluecraft Studio · ko-fi.com/cluecraftstudio</footer><script>
const N=16,G=[["P", "W", "Z", "S", "S", "A", "P", "M", "O", "C", "G", "K", "O", "C", "I", "G"], ["F", "C", "O", "Y", "R", "L", "G", "P", "Z", "K", "H", "U", "Z", "M", "N", "G"], ["C", "N", "O", "J", "R", "E", "V", "I", "R", "G", "D", "U", "T", "V", "K", "V"], ["I", "M", "Z", "M", "H", "P", "N", "C", "M", "X", "V", "N", "A", "O", "G", "R"], ["C", "D", "L", "Z", "A", "A", "L", "W", "L", "A", "I", "T", "E", "N", "T", "S"], ["E", "A", "B", "M", "N", "F", "I", "C", "Y", "E", "M", "V", "X", "L", "S", "U"], ["S", "P", "M", "F", "P", "Q", "J", "F", "W", "L", "A", "N", "T", "E", "R", "N"], ["Q", "V", "A", "P", "C", "C", "B", "S", "L", "R", "W", "O", "D", "V", "A", "W"], ["T", "Y", "T", "Z", "F", "O", "Z", "U", "E", "V", "T", "R", "A", "I", "L", "F"], ["Z", "N", "G", "X", "O", "I", "N", "I", "A", "T", "N", "U", "O", "M", "U", "R"], ["O", "E", "E", "C", "R", "E", "R", "J", "K", "M", "C", "B", "R", "R", "C", "W"], ["L", "E", "O", "B", "E", "G", "I", "E", "V", "K", "C", "I", "E", "I", "O", "O"], ["G", "T", "N", "D", "S", "Q", "Z", "K", "H", "D", "I", "U", "F", "A", "N", "A"], ["U", "N", "M", "T", "T", "O", "U", "S", "B", "Z", "K", "H", "Z", "I", "I", "P"], ["V", "A", "G", "R", "S", "R", "K", "K", "A", "E", "J", "L", "V", "L", "B", "M"], ["M", "C", "U", "K", "C", "A", "P", "K", "C", "A", "B", "B", "X", "H", "Q", "C"]],W=["LANTERN", "COMPASS", "CAMPFIRE", "BACKPACK", "FOREST", "RIVER", "TRAIL", "MAP", "TENT", "BINOCULARS", "CANTEEN", "MOUNTAIN"],P={"BINOCULARS": ["14,14", "13,14", "12,14", "11,14", "10,14", "9,14", "8,14", "7,14", "6,14", "5,14"], "CAMPFIRE": ["4,0", "5,1", "6,2", "7,3", "8,4", "9,5", "10,6", "11,7"], "BACKPACK": ["15,10", "15,9", "15,8", "15,7", "15,6", "15,5", "15,4", "15,3"], "MOUNTAIN": ["9,13", "9,12", "9,11", "9,10", "9,9", "9,8", "9,7", "9,6"], "LANTERN": ["6,9", "6,10", "6,11", "6,12", "6,13", "6,14", "6,15"], "COMPASS": ["0,9", "0,8", "0,7", "0,6", "0,5", "0,4", "0,3"], "CANTEEN": ["15,1", "14,1", "13,1", "12,1", "11,1", "10,1", "9,1"], "FOREST": ["8,4", "9,4", "10,4", "11,4", "12,4", "13,4"], "RIVER": ["2,8", "2,7", "2,6", "2,5", "2,4"], "TRAIL": ["8,10", "8,11", "8,12", "8,13", "8,14"], "TENT": ["4,11", "4,12", "4,13", "4,14"], "MAP": ["5,3", "4,4", "3,5"]};let first=null,found=new Set();const grid=document.getElementById('grid'),list=document.getElementById('words'),status=document.getElementById('status');
function cell(r,c){return grid.children[r*N+c]}for(let r=0;r<N;r++)for(let c=0;c<N;c++){let b=document.createElement('button');b.className='cell';b.textContent=G[r][c];b.addEventListener('click',()=>tap(r,c));grid.append(b)}W.forEach(w=>{let li=document.createElement('li');li.id='w'+w;li.textContent=w;list.append(li)});
function tap(r,c){if(!first){first={r,c};cell(r,c).classList.add('first');status.textContent='Now tap the last letter.';return}let a=first;first=null;document.querySelectorAll('.first').forEach(x=>x.classList.remove('first'));let dr=r-a.r,dc=c-a.c;if(!(dr===0||dc===0||Math.abs(dr)===Math.abs(dc))){first={r,c};cell(r,c).classList.add('first');status.textContent='Choose a straight row, column, or diagonal.';return}let sr=Math.sign(dr),sc=Math.sign(dc),n=Math.max(Math.abs(dr),Math.abs(dc)),seq=[];for(let i=0;i<=n;i++)seq.push(`${a.r+sr*i},${a.c+sc*i}`);let rev=[...seq].reverse();let hit=W.find(w=>!found.has(w)&&(seq.join('|')===P[w].join('|')||rev.join('|')===P[w].join('|')));if(!hit){status.textContent='Not a listed word. Try again.';return}found.add(hit);document.getElementById('w'+hit).classList.add('done');P[hit].forEach(k=>{let [x,y]=k.split(',').map(Number);cell(x,y).classList.add('found')});status.textContent=found.size===W.length?'You found every word! Puzzle solved!':`${found.size} of ${W.length} found.`}
</script></body></html>
